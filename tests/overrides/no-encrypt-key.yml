# tests/e2e-security.sh only: NocoDB without NC_CONNECTION_ENCRYPT_KEY and
# allowed to reach this host's private networks, so a test database inside
# the stack can be connected and its password looked for in a backup. Never
# deploy with this file.
services:
  nocodb:
    environment:
      NC_CONNECTION_ENCRYPT_KEY: ""
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
